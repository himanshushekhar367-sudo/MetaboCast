[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metabocast"
version = "1.0.0"
description = "Predict spatial metabolite (MSI ion) maps from spatial transcriptomics, with per-ion reliability"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Himanshu Shekhar"},
  {name = "Auroni Deep"},
  {name = "Shilpi Minocha"},
  {name = "Saran Kumar"},
]
keywords = ["spatial transcriptomics", "spatial metabolomics", "mass spectrometry imaging", "metabolite prediction"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.23","scipy>=1.9","scikit-learn>=1.2","pandas>=1.5","anndata>=0.9","scanpy>=1.9"]

[project.optional-dependencies]
# harmonypy 2.x ships no Windows wheels; the pure-Python 0.0.x series provides the same run_harmony interface there
reproduce = [
  "matplotlib>=3.6", "openpyxl>=3.0", "h5py>=3.0", "pillow>=9.0",
  "harmonypy>=0.0.9; platform_system != 'Windows'",
  "harmonypy>=0.0.9,<0.1; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/himanshushekhar367-sudo/MetaboCast"
Documentation = "https://github.com/himanshushekhar367-sudo/MetaboCast/blob/main/docs/USAGE.md"
Issues = "https://github.com/himanshushekhar367-sudo/MetaboCast/issues"
Archive = "https://doi.org/10.5281/zenodo.23661778"

[tool.setuptools]
packages = ["metabocast"]

[tool.setuptools.package-data]
metabocast = ["data/genesets/*.gmt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
